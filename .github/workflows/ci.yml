# Every example published here is compiled, parsed or RUN on every pull request
# and on every push to `main`.
#
# This repository is public and linked from every page on getpeppr.dev: an
# integrator copies these files verbatim. They had never been checked
# AUTOMATICALLY — the GPR-1261 audit did read and run them, once, by hand, and
# recorded 33 defect sites, among them a route removed from the API that was
# still published in 16 places across 8 files. A one-off audit does not survive
# the next commit; this does.
#
# Parsing alone was not enough, and the gap was named before it was closed:
# `check-python.mjs` listed "a value written to a file with the wrong extension"
# among the things it cannot see. That is precisely what shipped — the cURL
# export example had no `--fail`, so the gateway's 404 JSON body was written into
# `invoice.pdf` (GPR-1286). `check:export` closes it by EXECUTING the export
# examples.
#
# No secret is used and no getpeppr API call is made. `tsc --noEmit`, `bash -n`
# and `py_compile` parse without executing; `check:export` does execute, but
# against a replay of the gateway served from 127.0.0.1, and it aborts before
# running anything if a rewritten copy still mentions api.getpeppr.dev — so it
# cannot reach the real API even when it is wrong. `npm ci --ignore-scripts` runs
# no package lifecycle script. The job reaches the network to install from npm
# and PyPI and to restore the setup-node cache; the CHECKS themselves make one
# outbound request between them, an anonymous GET of the public OpenAPI spec.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Route mentions can go stale without anyone touching this repository: the
  # spec changes on the other side. A weekly run catches that drift.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Examples compile and parse
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit their tag resolved to on 2026-09-04:
      # only a full SHA is immutable, and a moved tag would change what runs on
      # the runner without any change to this repository. Dependabot
      # (.github/dependabot.yml) opens the pull request that moves them, so
      # pinning does not trade a live risk for a stale one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here talks to GitHub after checkout, so the automatic token
          # has no reason to stay in the runner's git config.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # No package in the lockfile declares an install script. Refusing them
      # outright means a pull request cannot introduce one that runs here.
      - run: npm ci --ignore-scripts

      # The Python examples are plain HTTP and need `requests` to RUN. Without
      # it `check:export` reported four of them green: the script died on the
      # import, wrote no file, and "wrote no file" is what two of its three
      # scenarios require. The check now refuses that output, so this step is
      # part of the check rather than a convenience.
      - run: pip install -r examples/python/requirements.txt

      # Each check is its own step so a red run names the surface that broke
      # without anyone opening the log, and `if: always()` keeps the later steps
      # running after an earlier failure — one red lane must not hide the state
      # of the other five.
      - name: TypeScript examples compile against @getpeppr/sdk
        if: always()
        run: npm run check:examples

      - name: Markdown TypeScript fragments compile
        if: always()
        run: npm run check:snippets

      - name: Python examples compile
        if: always()
        run: npm run check:python

      - name: Shell blocks parse
        if: always()
        run: npm run check:shell

      - name: Postman collection is structurally sound
        if: always()
        run: npm run check:postman

      - name: Every mentioned API path and method exists in the published spec
        if: always()
        run: npm run check:routes

      # The only step that RUNS a published example rather than reading it, and
      # the only one that can see a file saved under a name its contents do not
      # match. It answers from a local replay, never from the API.
      - name: Export examples behave against a replay of the gateway
        if: always()
        run: npm run check:export
