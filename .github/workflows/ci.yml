# Every example published here is compiled or parsed on every pull request and
# on every push to `main`.
#
# This repository is public and linked from every page on getpeppr.dev: an
# integrator copies these files verbatim. They had never been checked
# AUTOMATICALLY — the GPR-1261 audit did read and run them, once, by hand, and
# recorded 33 defect sites, among them a route removed from the API that was
# still published in 16 places across 8 files. A one-off audit does not survive
# the next commit; this does.
#
# No secret is used and no getpeppr API call is made. `tsc --noEmit`, `bash -n`
# and `py_compile` all parse without executing, and `npm ci --ignore-scripts`
# runs no package lifecycle script. The job does reach the network to install
# from npm and to restore the setup-node cache; the CHECKS themselves make one
# request between them, an anonymous GET of the public OpenAPI spec.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Route mentions can go stale without anyone touching this repository: the
  # spec changes on the other side. A weekly run catches that drift.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Examples compile and parse
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit their tag resolved to on 2026-09-04:
      # only a full SHA is immutable, and a moved tag would change what runs on
      # the runner without any change to this repository. Dependabot
      # (.github/dependabot.yml) opens the pull request that moves them, so
      # pinning does not trade a live risk for a stale one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here talks to GitHub after checkout, so the automatic token
          # has no reason to stay in the runner's git config.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # No package in the lockfile declares an install script. Refusing them
      # outright means a pull request cannot introduce one that runs here.
      - run: npm ci --ignore-scripts

      # Each check is its own step so a red run names the surface that broke
      # without anyone opening the log, and `if: always()` keeps the later steps
      # running after an earlier failure — one red lane must not hide the state
      # of the other five.
      - name: TypeScript examples compile against @getpeppr/sdk
        if: always()
        run: npm run check:examples

      - name: Markdown TypeScript fragments compile
        if: always()
        run: npm run check:snippets

      - name: Python examples compile
        if: always()
        run: npm run check:python

      - name: Shell blocks parse
        if: always()
        run: npm run check:shell

      - name: Postman collection is structurally sound
        if: always()
        run: npm run check:postman

      - name: Every mentioned API path and method exists in the published spec
        if: always()
        run: npm run check:routes
